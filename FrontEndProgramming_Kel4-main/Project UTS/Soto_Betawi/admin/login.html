<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Admin - Soto Betawi Jakarta</title>
    <!--Ini bagian CSS untuk halaman login-->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="login-page">
    <!--Ini bagian kotak login-->
    <main class="login-container">
      <!--Ini bagian nama restoran-->
      <div class="login-brand">
        <h1>Soto Betawi</h1>
        <p>Admin Panel</p>
      </div>
      <!--Ini bagian form login-->
      <form id="adminLoginForm">
        <!--Ini bagian username-->
        <div class="form-group">
          <label for="adminUsername">Username</label>
          <input
            type="text"
            id="adminUsername"
            placeholder="Masukkan username"
            required
          />
        </div>
        <!--Ini bagian password-->
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="Masukkan password"
            required
          />
        </div>
        <!--Ini bagian pesan error-->
        <p id="loginMessage" class="login-message"></p>
        <!--Ini tombol login-->
        <button type="submit" class="login-button">Login</button>
      </form>
      <!--Ini bagian kembali ke website-->
      <a href="../index.html" class="back-web"> Kembali ke Website </a>
    </main>

    <!--Ini bagian JavaScript login-->
    <script src="login.js"></script>
  </body>
</html>
